<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Mage Hopper</title>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="rotate-hint" aria-live="polite">
      <span>Landscape works best — or tap Play here in portrait.</span>
      <button type="button" id="rotate-dismiss">Got it</button>
    </div>
    <div id="mobile-controls" aria-hidden="true">
      <div class="pad">
        <button type="button" id="btn-left" aria-label="Move left">&lt;</button>
        <button type="button" id="btn-right" aria-label="Move right">&gt;</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-jump" aria-label="Jump">JUMP</button>
        <button type="button" id="btn-attack" aria-label="Fire">FIRE</button>
        <button type="button" id="btn-extra" aria-label="Staff slam">SLAM</button>
      </div>
    </div>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
